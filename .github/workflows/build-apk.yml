name: Build Learnly-Grade8.apk

on:
  workflow_dispatch:

  push:
    branches:
      - main

concurrency:
  group: learnly-grade8-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  build-apk:

    name: Build Learnly Grade 8 APK

    runs-on: ubuntu-24.04

    timeout-minutes: 120

    steps:

      - name: Checkout Learnly
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip


      - name: Install Linux dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            unzip \
            zip \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libffi-dev \
            libssl-dev


      - name: Install Python dependencies
        run: |

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "GitPython>=3.1.40"

          python -m pip install \
            "PySide6==6.10.0"


      - name: Verify dependencies
        run: |

          python - <<'PY'

          import git
          import PySide6

          print("GitPython:", git.__version__)
          print("PySide6:", PySide6.__version__)

          PY


      - name: Install PySide deployment tools
        run: |

          git clone \
            --depth 1 \
            --branch 6.10 \
            https://code.qt.io/pyside/pyside-setup.git \
            "$RUNNER_TEMP/pyside-setup"


      - name: Download Android SDK and NDK
        run: |

          python \
            "$RUNNER_TEMP/pyside-setup/tools/cross_compile_android/main.py" \
            --download-only \
            --skip-update \
            --auto-accept-license


      - name: Download Android PySide wheels
        run: |

          mkdir -p "$RUNNER_TEMP/android-wheels"

          qtpip download \
            PySide6 \
            --android \
            --arch aarch64 \
            -d "$RUNNER_TEMP/android-wheels"

          qtpip download \
            Shiboken6 \
            --android \
            --arch aarch64 \
            -d "$RUNNER_TEMP/android-wheels"

          echo ""
          echo "Downloaded wheels:"
          ls -lh "$RUNNER_TEMP/android-wheels"


      - name: Find Android wheels
        id: wheels
        shell: bash
        run: |

          PYSIDE=$(find \
            "$RUNNER_TEMP/android-wheels" \
            -type f \
            -name 'PySide6-*.whl' \
            | head -1)

          SHIBOKEN=$(find \
            "$RUNNER_TEMP/android-wheels" \
            -type f \
            -iname 'shiboken6-*.whl' \
            | head -1)

          if [ -z "$PYSIDE" ]; then

            echo "ERROR: PySide6 Android wheel missing."

            exit 1

          fi


          if [ -z "$SHIBOKEN" ]; then

            echo "ERROR: Shiboken6 Android wheel missing."

            exit 1

          fi


          echo "PySide6:"
          echo "$PYSIDE"

          echo "Shiboken6:"
          echo "$SHIBOKEN"


          echo "pyside=$PYSIDE" >> "$GITHUB_OUTPUT"

          echo "shiboken=$SHIBOKEN" >> "$GITHUB_OUTPUT"


      - name: Check Learnly files
        run: |

          echo "Checking project..."

          test -f main.py

          test -f pysidedeploy.spec

          echo ""
          echo "main.py:"
          ls -lh main.py

          echo ""
          echo "Project:"
          find . \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -200


      - name: Build Learnly APK
        run: |

          pyside6-android-deploy \
            --name "Learnly-Grade8" \
            --wheel-pyside="${{ steps.wheels.outputs.pyside }}" \
            --wheel-shiboken="${{ steps.wheels.outputs.shiboken }}" \
            --arch=aarch64 \
            --force \
            --verbose


      - name: Locate APK
        run: |

          echo "Searching for APK..."

          find . \
            -type f \
            -name "*.apk" \
            -print


      - name: Prepare APK
        run: |

          mkdir -p dist

          APK=$(find . \
            -type f \
            -name "*.apk" \
            | head -1)


          if [ -z "$APK" ]; then

            echo "ERROR: No APK was produced."

            exit 1

          fi


          echo "Found:"
          echo "$APK"


          cp "$APK" \
            "dist/Learnly-Grade8.apk"


          sha256sum \
            "dist/Learnly-Grade8.apk" \
            > "dist/Learnly-Grade8.apk.sha256"


          echo ""
          echo "Final APK:"
          ls -lh \
            "dist/Learnly-Grade8.apk"


      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: Learnly-Grade8

          path: |

            dist/Learnly-Grade8.apk
            dist/Learnly-Grade8.apk.sha256

          retention-days: 30
