name: Build Learnly-Grade8.apk

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learnly-grade8-apk
  cancel-in-progress: true

jobs:

  build:

    name: Build Learnly Grade 8 APK

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-virtualenv \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install cython==0.29.34
          python -m pip install setuptools

      - name: Show project
        run: |
          echo "Project:"
          find . -maxdepth 3 -type f | sort

      - name: Check Buildozer configuration
        run: |
          test -f buildozer.spec
          test -f main.py
          echo "buildozer.spec found"
          echo "main.py found"

      - name: Build Android APK
        run: |
          yes | buildozer android debug

      - name: Find APK
        run: |
          find bin -type f -name "*.apk" -print

      - name: Rename APK
        run: |
          APK=$(find bin -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          cp "$APK" Learnly-Grade8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Learnly-Grade8
          path: Learnly-Grade8.apk
          if-no-files-found: error
