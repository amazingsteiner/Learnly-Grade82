name: Build Learnly-Grade8.apk

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build-apk:

    name: Build Learnly Grade 8 APK

    runs-on: ubuntu-24.04

    timeout-minutes: 180

    steps:

      # ======================================================
      # SOURCE
      # ======================================================

      - name: Checkout Learnly
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ======================================================
      # LINUX DEPENDENCIES
      # ======================================================

      - name: Install Linux dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libffi-dev \
            libssl-dev


      # ======================================================
      # BASE PYSIDE6
      # ======================================================

      - name: Install PySide6
        run: |

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            PySide6==6.10.0


      # ======================================================
      # QT FOR PYTHON SOURCE
      # ======================================================

      - name: Clone PySide setup 6.10
        run: |

          git clone \
            --depth 1 \
            --branch 6.10 \
            https://code.qt.io/pyside/pyside-setup.git \
            "$RUNNER_TEMP/pyside-setup"


      # ======================================================
      # PYSIDE BUILD REQUIREMENTS
      # ======================================================

      - name: Install PySide setup requirements
        run: |

          python -m pip install \
            -r "$RUNNER_TEMP/pyside-setup/requirements.txt"


      # ======================================================
      # ANDROID TOOL REQUIREMENTS
      # ======================================================

      - name: Install Android deployment requirements
        run: |

          python -m pip install \
            -r "$RUNNER_TEMP/pyside-setup/tools/cross_compile_android/requirements.txt"


      # ======================================================
      # CRITICAL PYSIDE6 ANDROID REQUIREMENTS
      #
      # This is the dependency that was missing in #46:
      # pkginfo
      # ======================================================

      - name: Install PySide6 Android requirements
        run: |

          python -m pip install \
            -r "$(python -c 'import PySide6, pathlib; print(pathlib.Path(PySide6.__file__).parent / "scripts" / "requirements-android.txt")')"


      # ======================================================
      # VERIFY EVERYTHING
      # ======================================================

      - name: Verify Android deployment environment
        run: |

          echo "PySide6:"
          python -m pip show PySide6

          echo ""
          echo "Android requirements:"
          python -m pip show pkginfo

          echo ""
          echo "PySide Android deploy:"
          pyside6-android-deploy --help

          echo ""
          echo "qtpip:"
          qtpip --help


      # ======================================================
      # ANDROID SDK / NDK
      # ======================================================

      - name: Download Android SDK and NDK
        run: |

          cd "$RUNNER_TEMP/pyside-setup"

          python tools/cross_compile_android/main.py \
            --download-only \
            --skip-update \
            --auto-accept-license


      # ======================================================
      # ANDROID PYSIDE6 WHEEL
      # ======================================================

      - name: Download Android PySide6 wheel
        run: |

          mkdir -p "$RUNNER_TEMP/android-wheels"

          qtpip download \
            PySide6 \
            --android \
            --arch aarch64 \
            -d "$RUNNER_TEMP/android-wheels"


      # ======================================================
      # ANDROID SHIBOKEN6 WHEEL
      # ======================================================

      - name: Download Android Shiboken6 wheel
        run: |

          qtpip download \
            Shiboken6 \
            --android \
            --arch aarch64 \
            -d "$RUNNER_TEMP/android-wheels"


      # ======================================================
      # FIND WHEELS
      # ======================================================

      - name: Locate Android wheels
        id: wheels
        shell: bash
        run: |

          echo "Available wheels:"
          find "$RUNNER_TEMP/android-wheels" \
            -type f \
            -name "*.whl" \
            -print

          PYSIDE=$(find \
            "$RUNNER_TEMP/android-wheels" \
            -type f \
            -name 'PySide6-*.whl' \
            | head -1)

          SHIBOKEN=$(find \
            "$RUNNER_TEMP/android-wheels" \
            -type f \
            -iname 'shiboken6-*.whl' \
            | head -1)

          if [ -z "$PYSIDE" ]; then
            echo "ERROR: PySide6 Android wheel not found."
            exit 1
          fi

          if [ -z "$SHIBOKEN" ]; then
            echo "ERROR: Shiboken6 Android wheel not found."
            exit 1
          fi

          echo "pyside=$PYSIDE" >> "$GITHUB_OUTPUT"
          echo "shiboken=$SHIBOKEN" >> "$GITHUB_OUTPUT"


      # ======================================================
      # VERIFY LEARNLY
      # ======================================================

      - name: Verify Learnly project
        run: |

          test -f main.py

          echo "✓ main.py found"

          if [ -f pysidedeploy.spec ]; then
            echo "✓ pysidedeploy.spec found"
          fi


      # ======================================================
      # BUILD ANDROID APK
      # ======================================================

      - name: Build Learnly Android APK
        run: |

          pyside6-android-deploy \
            --name "Learnly-Grade8" \
            --wheel-pyside="${{ steps.wheels.outputs.pyside }}" \
            --wheel-shiboken="${{ steps.wheels.outputs.shiboken }}" \
            --arch aarch64 \
            --force \
            --verbose


      # ======================================================
      # FIND APK
      # ======================================================

      - name: Find generated APK
        run: |

          echo "Searching for APK..."

          find . \
            -type f \
            -name "*.apk" \
            -print


      # ======================================================
      # PREPARE APK
      # ======================================================

      - name: Prepare Learnly APK
        shell: bash
        run: |

          mkdir -p dist

          APK=$(find . \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          cp "$APK" \
            "dist/Learnly-Grade8.apk"

          sha256sum \
            "dist/Learnly-Grade8.apk" \
            > "dist/Learnly-Grade8.apk.sha256"

          echo ""
          ls -lh dist/


      # ======================================================
      # UPLOAD APK ARTIFACT
      # ======================================================

      - name: Upload Learnly APK
        uses: actions/upload-artifact@v4
        with:
          name: Learnly-Grade8
          path: |
            dist/Learnly-Grade8.apk
            dist/Learnly-Grade8.apk.sha256
          retention-days: 30
