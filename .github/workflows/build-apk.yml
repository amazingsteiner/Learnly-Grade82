name: Build Learnly-Grade8.apk

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build-apk:

    name: Build Learnly Grade 8 APK

    runs-on: ubuntu-24.04

    timeout-minutes: 180

    steps:

      # ------------------------------------------------------
      # SOURCE
      # ------------------------------------------------------

      - name: Checkout Learnly
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ------------------------------------------------------
      # LINUX BUILD DEPENDENCIES
      # ------------------------------------------------------

      - name: Install Linux dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libffi-dev \
            libssl-dev


      # ------------------------------------------------------
      # PYTHON BUILD DEPENDENCIES
      # ------------------------------------------------------

      - name: Install PySide6
        run: |

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            PySide6==6.10.0


      # ------------------------------------------------------
      # GET OFFICIAL PYSIDE SETUP
      # ------------------------------------------------------

      - name: Clone Qt for Python
        run: |

          git clone \
            --depth 1 \
            --branch 6.10 \
            https://code.qt.io/pyside/pyside-setup.git \
            "$RUNNER_TEMP/pyside-setup"


      # ------------------------------------------------------
      # OFFICIAL PYSIDE REQUIREMENTS
      # ------------------------------------------------------

      - name: Install PySide setup requirements
        run: |

          python -m pip install \
            -r "$RUNNER_TEMP/pyside-setup/requirements.txt"


      - name: Install Android deployment requirements
        run: |

          python -m pip install \
            -r "$RUNNER_TEMP/pyside-setup/tools/cross_compile_android/requirements.txt"


      # ------------------------------------------------------
      # VERIFY DEPLOYMENT TOOL
      # ------------------------------------------------------

      - name: Verify PySide Android deployment
        run: |

          python -m pip show PySide6

          pyside6-android-deploy --help

          qtpip --help


      # ------------------------------------------------------
      # OFFICIAL ANDROID SDK + NDK DOWNLOAD
      # ------------------------------------------------------

      - name: Download Android SDK and NDK
        run: |

          cd "$RUNNER_TEMP/pyside-setup"

          python tools/cross_compile_android/main.py \
            --download-only \
            --skip-update \
            --auto-accept-license


      # ------------------------------------------------------
      # OFFICIAL ANDROID PYSIDE6 WHEEL
      # ------------------------------------------------------

      - name: Download Android PySide6 wheel
        run: |

          mkdir -p "$RUNNER_TEMP/android-wheels"

          qtpip download \
            PySide6 \
            --android \
            --arch aarch64 \
            -d "$RUNNER_TEMP/android-wheels"


      # ------------------------------------------------------
      # OFFICIAL ANDROID SHIBOKEN6 WHEEL
      # ------------------------------------------------------

      - name: Download Android Shiboken6 wheel
        run: |

          qtpip download \
            Shiboken6 \
            --android \
            --arch aarch64 \
            -d "$RUNNER_TEMP/android-wheels"


      # ------------------------------------------------------
      # FIND WHEELS
      # ------------------------------------------------------

      - name: Locate Android wheels
        id: wheels
        shell: bash
        run: |

          echo "Downloaded wheels:"
          find "$RUNNER_TEMP/android-wheels" \
            -type f \
            -name "*.whl" \
            -print

          PYSIDE=$(find \
            "$RUNNER_TEMP/android-wheels" \
            -type f \
            -name "PySide6-*.whl" \
            | head -n 1)

          SHIBOKEN=$(find \
            "$RUNNER_TEMP/android-wheels" \
            -type f \
            -iname "shiboken6-*.whl" \
            | head -n 1)

          if [ -z "$PYSIDE" ]; then
            echo "ERROR: Android PySide6 wheel not found."
            exit 1
          fi

          if [ -z "$SHIBOKEN" ]; then
            echo "ERROR: Android Shiboken6 wheel not found."
            exit 1
          fi

          echo "PySide6 wheel:"
          echo "$PYSIDE"

          echo "Shiboken6 wheel:"
          echo "$SHIBOKEN"

          echo "pyside=$PYSIDE" >> "$GITHUB_OUTPUT"
          echo "shiboken=$SHIBOKEN" >> "$GITHUB_OUTPUT"


      # ------------------------------------------------------
      # VERIFY LEARNLY
      # ------------------------------------------------------

      - name: Verify Learnly project
        run: |

          echo "Checking Learnly..."

          test -f main.py

          echo "✓ main.py found"

          if [ -f pysidedeploy.spec ]; then
            echo "✓ pysidedeploy.spec found"
          else
            echo "⚠ pysidedeploy.spec not found"
          fi

          echo
          echo "Project files:"
          find . \
            -maxdepth 3 \
            -type f \
            | sort


      # ------------------------------------------------------
      # BUILD APK USING OFFICIAL TOOL
      # ------------------------------------------------------

      - name: Build Learnly Android APK
        run: |

          pyside6-android-deploy \
            --name "Learnly-Grade8" \
            --wheel-pyside="${{ steps.wheels.outputs.pyside }}" \
            --wheel-shiboken="${{ steps.wheels.outputs.shiboken }}" \
            --arch aarch64 \
            --force \
            --verbose


      # ------------------------------------------------------
      # FIND RESULT
      # ------------------------------------------------------

      - name: Find generated APK
        run: |

          echo "Searching for APK..."

          find . \
            -type f \
            -name "*.apk" \
            -print


      # ------------------------------------------------------
      # PREPARE ARTIFACT
      # ------------------------------------------------------

      - name: Prepare Learnly APK
        shell: bash
        run: |

          mkdir -p dist

          APK=$(find . \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" \
            "dist/Learnly-Grade8.apk"

          sha256sum \
            "dist/Learnly-Grade8.apk" \
            > "dist/Learnly-Grade8.apk.sha256"

          echo
          echo "Final files:"
          ls -lh dist/


      # ------------------------------------------------------
      # UPLOAD APK
      # ------------------------------------------------------

      - name: Upload Learnly APK
        uses: actions/upload-artifact@v4
        with:
          name: Learnly-Grade8
          path: |
            dist/Learnly-Grade8.apk
            dist/Learnly-Grade8.apk.sha256
          retention-days: 30
