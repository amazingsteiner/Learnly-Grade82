name: Legacy APK Builder (disabled)

# The old ArtemSBulgakov/buildozer-action workflow is intentionally disabled.
# It failed before checkout because its Docker image adds an obsolete
# openjdk-r PPA that returns HTTP 404 on the current Ubuntu base.
#
# The active Android build is now .github/workflows/build.yml.

on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-22.04
    steps:
      - name: Legacy workflow disabled
        run: echo "Legacy workflow disabled. Use build.yml instead."
