name: Learnly Grade 8 - Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Learnly
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          CMDLINE_TOOLS="$SDK/cmdline-tools/16.0/bin"
          MODERN_SDKMANAGER="$CMDLINE_TOOLS/sdkmanager"

          test -x "$MODERN_SDKMANAGER"

          yes | "$MODERN_SDKMANAGER" --licenses >/dev/null || true
          "$MODERN_SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

          # Current python-for-android still probes the historical
          # $ANDROID_SDK_ROOT/tools/bin/sdkmanager location.
          # Modern Android SDKs do not ship that legacy launcher, while
          # the old launcher fails on Java 17 because JAXB is absent.
          # Link the legacy path directly to the modern sdkmanager.
          mkdir -p "$SDK/tools/bin"
          ln -sfn "$MODERN_SDKMANAGER" "$SDK/tools/bin/sdkmanager"

          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$CMDLINE_TOOLS" >> "$GITHUB_PATH"

          NDK="$SDK/ndk/28.2.13676358"
          test -d "$SDK"
          test -d "$NDK"
          test -x "$SDK/platform-tools/adb"
          test -x "$SDK/build-tools/35.0.0/aapt2"
          test -x "$NDK/ndk-build"
          test -x "$SDK/tools/bin/sdkmanager"
          test -L "$SDK/tools/bin/sdkmanager"

          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_NDK_ROOT=$NDK"
            echo "ANDROID_NDK=$NDK"
          } >> "$GITHUB_ENV"

          echo "Android SDK: $SDK"
          echo "Android NDK: $NDK"
          echo "Legacy sdkmanager path: $SDK/tools/bin/sdkmanager"
          "$SDK/tools/bin/sdkmanager" --version

      - name: Install Buildozer toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer>=1.6.0" "Cython==0.29.37"

      - name: Verify project and Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -f main.py
          test -f buildozer.spec
          python -m py_compile main.py
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_NDK_HOME/ndk-build"
          test -x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          test -L "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          echo "SDK: $ANDROID_SDK_ROOT"
          echo "NDK: $ANDROID_NDK_HOME"
          echo "Legacy sdkmanager: $ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --version
          grep -n "requirements\|android.api\|android.minapi" buildozer.spec

      - name: Build debug APK with preinstalled SDK/NDK
        shell: bash
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          set -euo pipefail
          buildozer -v android debug

      - name: Show generated APKs
        shell: bash
        run: find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: learnly-grade8-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Buildozer logs if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: learnly-build-logs
          path: |
            .buildozer/**
            buildozer.spec
          if-no-files-found: ignore
          retention-days: 7
