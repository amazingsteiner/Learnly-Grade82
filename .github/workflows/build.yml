name: Build APK (official PySide6-for-Android pipeline)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYSIDE_VERSION: "6.11.1"
  PY_TAG: "cp311-cp311"
  ARCH: "aarch64"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (required by Qt's Android toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r27.x and required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          NDK_PKG=$(sdkmanager --list 2>/dev/null | grep -oE 'ndk;27\.[0-9.]+' | head -n1)
          echo "Using NDK package: $NDK_PKG"
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "$NDK_PKG"
          NDK_DIR=$(find "$ANDROID_SDK_ROOT/ndk" -maxdepth 1 -type d -name "27.*" | head -n1)
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Resolved NDK dir: $NDK_DIR"

      - name: Install pyside6-android-deploy tooling
        run: |
          python -m pip install --upgrade pip
          pip install "pyside6==${{ env.PYSIDE_VERSION }}" buildozer cython

      - name: Download official Qt-for-Android wheels (PySide6 + shiboken6)
        run: |
          mkdir -p wheels
          BASE="https://download.qt.io/official_releases/QtForPython"
          curl -fL "$BASE/pyside6/pyside6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-${{ env.PY_TAG }}-android_${{ env.ARCH }}.whl" -o wheels/pyside6.whl
          curl -fL "$BASE/shiboken6/shiboken6-${{ env.PYSIDE_VERSION }}-${{ env.PYSIDE_VERSION }}-${{ env.PY_TAG }}-android_${{ env.ARCH }}.whl" -o wheels/shiboken6.whl
          ls -la wheels

      - name: Build APK with pyside6-android-deploy
        run: |
          pyside6-android-deploy \
            --wheel-pyside="$(pwd)/wheels/pyside6.whl" \
            --wheel-shiboken="$(pwd)/wheels/shiboken6.whl" \
            --name=main \
            --ndk-path="$ANDROID_NDK_HOME" \
            --sdk-path="$ANDROID_SDK_ROOT"

      - name: Locate built APK
        id: findapk
        run: |
          APK_PATH=$(find . -name "*.apk" -print -quit)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: steps.findapk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: learnly-apk
          path: ${{ steps.findapk.outputs.apk_path }}

      - name: Upload build logs on failure (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .buildozer/**/build.log
            *.log
          if-no-files-found: ignore
