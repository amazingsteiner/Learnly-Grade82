name: Learnly Grade 8 - Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Learnly
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

          SDK="${ANDROID_SDK_ROOT}"
          NDK="${SDK}/ndk/28.2.13676358"
          test -d "$SDK"
          test -d "$NDK"

          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_NDK_ROOT=$NDK"
          } >> "$GITHUB_ENV"

          echo "Android SDK: $SDK"
          echo "Android NDK: $NDK"

      - name: Install Buildozer toolchain
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer>=1.5.0" "Cython==0.29.37"

      - name: Verify project and Android toolchain
        shell: bash
        run: |
          set -e
          test -f main.py
          test -f buildozer.spec
          python -m py_compile main.py
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_NDK_HOME/ndk-build"
          yes | sdkmanager --licenses >/dev/null || true
          echo "SDK: $ANDROID_SDK_ROOT"
          echo "NDK: $ANDROID_NDK_HOME"
          grep -n "requirements\|android.api\|android.minapi" buildozer.spec

      - name: Build debug APK with preinstalled SDK/NDK
        shell: bash
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          set -e
          buildozer -v android debug

      - name: Show generated APKs
        shell: bash
        run: find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: learnly-grade8-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Buildozer logs if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: learnly-build-logs
          path: |
            .buildozer/**
            buildozer.spec
          if-no-files-found: ignore
          retention-days: 7
