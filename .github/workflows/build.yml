name: Learnly Grade 8 - Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Learnly
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK / NDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

          echo "Android SDK: ${ANDROID_SDK_ROOT}"
          echo "NDK:"
          find "${ANDROID_SDK_ROOT}/ndk" -maxdepth 1 -mindepth 1 -type d -print || true

      - name: Install Buildozer toolchain
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel

          # Buildozer/python-for-android is sensitive to Cython versions.
          python -m pip install \
            "buildozer>=1.5.0" \
            "Cython==0.29.37"

      - name: Verify project
        shell: bash
        run: |
          test -f main.py
          test -f buildozer.spec
          grep -n "requirements" buildozer.spec
          python -m py_compile main.py

      - name: Build debug APK
        shell: bash
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          buildozer -v android debug

      - name: Show generated APKs
        shell: bash
        run: |
          echo "APK files:"
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: learnly-grade8-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Buildozer logs if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: learnly-build-logs
          path: |
            .buildozer/**
            buildozer.spec
          if-no-files-found: ignore
          retention-days: 7
