name: Learnly Grade 8 - PySide6 Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Learnly
        uses: actions/checkout@v4
      - name: Checkout PySide6-to-apk builder
        uses: actions/checkout@v4
        with:
          repository: amazingsteiner/PySide6-to-apk
          path: builder
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y git p7zip-full
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PySide6 builder dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'PySide6==6.8.0' GitPython tqdm requests
          if [ -f builder/tools/cross_compile_android/requirements.txt ]; then python -m pip install -r builder/tools/cross_compile_android/requirements.txt; fi
      - name: Verify Learnly source
        run: python -m py_compile main.py
      - name: Build Learnly APK with repository backend
        run: python build_android.py
      - name: Find APK
        id: apk
        run: |
          APK=$(find dist -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK=$APK"
      - name: Upload Learnly APK
        uses: actions/upload-artifact@v4
        with:
          name: Learnly-Grade8-PySide6
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
